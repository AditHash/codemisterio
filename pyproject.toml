[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codemisterio"
version = "0.1.0a1"
description = "A transparent coding CLI powered by LangChain Deep Agents"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "deepagents>=0.7,<0.9",
  "langchain>=1.3,<2",
  "langgraph>=1.0,<2",
  "typer>=0.12,<1",
  "rich>=13,<16",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]
gemini = ["langchain-google-genai>=4,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
codemisterio = "codemisterio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codemisterio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
